<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Log | Life Replay</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="index.html">◒ Life Replay</a><button class="nav-toggle">Menu</button><div class="links"><a href="index.html">Home</a><a class="active" href="log.html">Daily log</a><a href="dashboard.html">Dashboard</a><a href="replay.html">Replay</a></div></nav><main class="page"><p class="eyebrow">Daily check-in</p><h1>How did your day unfold?</h1><p class="muted">Honest, small entries build the most useful replay.</p><div class="log-layout"><form id="logForm" class="panel"><h2>Day details</h2><input id="editingId" type="hidden"><div class="form-grid"><label>Date<input required id="date" type="date"></label><label>Coding <small>hours</small><input required id="coding" type="number" min="0" max="24" step=".25" value="0"></label><label>Reading <small>hours</small><input required id="reading" type="number" min="0" max="24" step=".25" value="0"></label><label>Exercise <small>hours</small><input required id="exercise" type="number" min="0" max="24" step=".25" value="0"></label><label>Entertainment <small>hours</small><input required id="entertainment" type="number" min="0" max="24" step=".25" value="0"></label><label>Sleep <small>hours</small><input required id="sleep" type="number" min="0" max="24" step=".25" value="0"></label><label>Energy level<select id="energy"><option value="1">1 — drained</option><option value="2">2 — low</option><option value="3" selected>3 — balanced</option><option value="4">4 — high</option><option value="5">5 — excellent</option></select></label><label>Mood<select id="mood"><option>Great</option><option selected>Good</option><option>Neutral</option><option>Low</option><option>Challenging</option></select></label></div><label>Memory of the day <small>optional</small><textarea id="notes" rows="4" maxlength="600" placeholder="What stood out today?"></textarea></label><p id="formError" class="error"></p><button class="button">Save day →</button> <button id="cancelEdit" class="plain hidden" type="button">Cancel edit</button></form><aside><p class="eyebrow">Your practice</p><h2>One entry,<br>more clarity.</h2><p class="muted">Daily entries stay in this browser. AI insight only sends your data when you request it.</p></aside></div></main><div id="toast"></div><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
