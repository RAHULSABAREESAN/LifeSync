<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Life Replay</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/advanced.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html">Life Replay</a><p class="eyebrow">Start today</p><h1>Start your Life<br><em>Replay journey.</em></h1><form data-auth-form="signup" novalidate><label>Username<input name="username" autocomplete="username" placeholder="Enter your username" required></label><label>Password<div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required><button type="button" data-password-toggle>Show</button></div><small>Use at least 7 characters.</small></label><div class="strength-meter" data-level="weak">Weak</div><label>Confirm Password<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" required></label><p class="auth-error" aria-live="polite"></p><button class="button" type="submit">Create Account</button></form><p class="muted">Already have an account? <a href="login.html">Login</a></p></section></main><script src="js/auth.js"></script></body></html>
