<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Puzzle | Life Replay</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/advanced.css"><link rel="stylesheet" href="css/word-puzzle.css"></head><body><nav><a class="brand" href="index.html">Life Replay</a><button class="nav-toggle">Menu</button><div class="links"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="replay.html">Replay</a><a class="active" href="word-puzzle.html">🎮 Word Puzzle</a></div></nav><main class="page puzzle-page"><header><p class="eyebrow">Offline mini-game</p><h1>🎮 Word <em>Puzzle</em></h1><p class="muted">A quick reset for your brain. Unscramble ten words before the clock runs out.</p></header><section class="puzzle-card" aria-live="polite"><div class="puzzle-status"><span>⭐ Score <b id="score">0</b></span><span>🎯 Round <b id="round">1</b>/10</span><span>⏱️ <b id="timer">20</b>s</span></div><div id="gameArea"><p class="eyebrow">Unscramble this word</p><output id="scramble" class="scramble"></output><form id="answerForm"><input id="answer" autocomplete="off" placeholder="Enter your answer" maxlength="20" required><div class="puzzle-actions"><button class="button" type="submit">Submit</button><button id="skip" class="button outline" type="button">Skip</button></div></form><p id="feedback" class="puzzle-feedback" role="status"></p></div><div id="finalScreen" class="hidden"><h2>Game complete!</h2><p>Your final score is <b id="finalScore">0</b> out of 100.</p><button id="restart" class="button" type="button">New Game</button></div></section></main><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/word-puzzle.js"></script></body></html>
